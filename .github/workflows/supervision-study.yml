name: Supervision study (no inference)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/repeat-supervision.mjs 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supervision-study-${{ runner.os }}
          path: reports/supervision-study/*.json
          retention-days: 7
